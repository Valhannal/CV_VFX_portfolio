<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanna Kachurouskaya — VFX Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&text=0123456789&display=swap">
<style>
@layer reset, base, layout, cube, components, overrides;

@property --arc-start { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
@property --arc-end   { syntax: "<percentage>"; inherits: false; initial-value: 0%; }

@layer reset {
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
}

@layer base {
  :root {
    color-scheme: light;

    /* palette sampled from the red-branches-on-grey-sky reference */
    --c-indigo: #c2cbdb;   /* sky */
    --c-ink: #000;
    --c-violet: #9aa6bd;   /* darker cloud */
    --c-coral: #d42420;    /* branch red */
    --c-teal: #aeb8ca;     /* mid sky */
    --c-moss: #f0683f;     /* lighter branch */
    --c-ultra: #b3341a;    /* deep branch */
    --c-mist: #eef1f6;     /* pale sky */
    --c-blue: #2f55ff;     /* strong blue accent: Open project */
    --spectrum: linear-gradient(90deg, var(--c-ultra), var(--c-coral), var(--c-moss));

    --bg: var(--c-indigo);
    --bg-light: color-mix(in oklch, var(--bg) 60%, white);
    --bg-edge: color-mix(in oklch, var(--bg) 85%, var(--c-violet));
    --fg: #000;
    --muted: #2a2d33;
    --soft: var(--c-mist);
    --border: color-mix(in oklch, var(--c-violet) 50%, var(--c-mist));
    --border-strong: var(--c-violet);
    --accent: var(--c-coral);
    --shade-color: var(--c-ink);
    --shadow-color: #2b3448;
    --sheen-color: oklch(100% 0 0);

    --cube-x: 50%;
    --cube-y: 50%;
    --light-x: var(--cube-x);
    --light-y: var(--cube-y);

    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-numeral: "Inter", var(--font-sans);
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;

    --text-base: 1rem;
    --text-sm: .875rem;
    --text-xs: .8125rem;

    --line: .5px;

    --card-solid: #d42420;   /* red sheets and strips */
    /* blue → red window, like the collage blocks */
    --card-paint: color-mix(in oklch, var(--card-solid) 62%, transparent);   /* see-through, frosted strips */
    --card-bg: color-mix(in oklch, var(--card-solid) 92%, transparent);
    --card-shadow:
      inset 0 1px 0 oklch(100% 0 0 / .06),
      0 1px 2px color-mix(in oklch, var(--shadow-color) 8%, transparent),
      0 16px 40px -16px color-mix(in oklch, var(--shadow-color) 22%, transparent);
    /* page column, Behance-style: max width, black on the sides */
    --frame-w: min(100vw, 1320px);
    --cube-size: min(70svh, calc(var(--frame-w) * .56), var(--cube-max, 1024px));
    /* big centred sheet; title strip above it, description strip below */
    --sheet-h: min(52svh, calc((var(--frame-w) - 3rem) / 1.69));
    --sheet-w: calc(var(--sheet-h) * 1.69);
    --ui-inset: 1.5rem;
    --reveal-duration: .5s;
    --reveal-delay: 80ms;
    --reveal-stagger: 60ms;
    --reveal-ease: cubic-bezier(.2, .7, .2, 1);
    --numeral-size: clamp(4.5rem, 7vw, 8rem);
    --numeral-color: #000;
    --face-fade: .35s;
    --spinner-exit: .2s;
    --scene-fade: .7s;
  }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  html { background: #000; }

  body {
    min-block-size: 100dvh;
    background: transparent;   /* black comes from <html>; an opaque body would cover the sky layer */
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: 1.6;
  }

  body::before {
    content: "";
    position: fixed;
    inset-block: 0;
    inset-inline-start: 0;
    inline-size: 100%;
    z-index: -1;
    /* sky: deeper blue at the bottom fading to pale blue at the top */
    background: linear-gradient(to top, #3f5ca3 0%, #6584c4 45%, #9db3e0 100%);
    pointer-events: none;
  }

  /* ── smeared paint background ── */
  .paint {
    position: fixed;
    inset: -10vmax;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .paint span {
    position: absolute;
    inset-block-start: var(--y);
    inset-inline-start: var(--x);
    inline-size: var(--w);
    block-size: var(--h);
    border-radius: 62% 38% 55% 45% / 48% 60% 40% 52%;
    background: var(--c);
    opacity: var(--o, .7);
    filter: blur(var(--b, 60px));
    rotate: var(--r, 0deg);
    animation: paint-drift var(--t, 40s) ease-in-out infinite alternate;
    animation-delay: var(--d, 0s);
  }

  /* light streaks over the colour, like wet paint dragged sideways */
  .paint::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(178deg, transparent 18%, oklch(100% 0 0 / .14) 22%, transparent 27%),
      linear-gradient(181deg, transparent 52%, oklch(100% 0 0 / .1) 56%, transparent 61%),
      linear-gradient(179deg, transparent 74%, oklch(100% 0 0 / .08) 77%, transparent 82%);
    filter: blur(12px);
  }

  /* ── thread tree (generated on canvas) ── */
  .threads {
    position: fixed;
    inset: 0;
    z-index: -1;
    inline-size: 100%;
    block-size: 100%;
    pointer-events: none;
  }

  /* plain black panels on both sides of the page column */
  .side-glass {
    position: fixed;
    inset-block: 0;
    z-index: 1;
    inline-size: calc(50% - min(50%, 660px));
    background: #000;   /* plain black sides */
    pointer-events: none;
  }

  .side-glass.left  { inset-inline-start: 0; }
  .side-glass.right { inset-inline-end: 0; }

  @keyframes paint-drift {
    0%   { translate: 0 0; scale: 1; border-radius: 62% 38% 55% 45% / 48% 60% 40% 52%; }
    50%  { translate: var(--dx, 4vw) var(--dy, 2vh); scale: 1.08 .94; border-radius: 40% 60% 35% 65% / 60% 38% 62% 40%; }
    100% { translate: calc(var(--dx, 4vw) * -.6) calc(var(--dy, 2vh) * 1.4); scale: .95 1.06; border-radius: 55% 45% 68% 32% / 42% 55% 45% 58%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .paint span { animation: none; }
  }

  a { color: inherit; text-underline-offset: .15em; }
  ::selection { background: var(--fg); color: var(--bg); }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
}

@layer layout {
  .frame-back {
    position: fixed;
    inset-block: 0;
    inset-inline-start: 0;
    inline-size: 100%;
    z-index: 0;
    overflow: hidden;
    transform: translateZ(0);
    pointer-events: none;
  }

  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: grid;
    place-items: center;
    perspective: 1100px;
    pointer-events: none;
  }

  /* fixed one-cell grid: the oversized glow must not stretch the row and push the deck down */
  .scene { grid-template: 100% / 100%; }
  .scene > * { grid-area: 1 / 1; }

  .page-loader {
    --s: var(--cube-size);
    position: fixed;
    inset-block-start: var(--cube-y);
    inset-inline-start: var(--cube-x);
    z-index: 0;
    display: grid;
    translate: -50% -50%;
    pointer-events: none;
  }

  [data-state]:not([data-state="loading"]) .page-loader .face-spinner { scale: .5; opacity: 0; }

  .stops { position: relative; z-index: 1; min-block-size: calc(100vh + 1px); max-inline-size: var(--frame-w); margin-inline: auto; }
  .pen-list { list-style: none; }

  .stop {
    display: flex;
    align-items: center;
    min-block-size: 100svh;
    padding: clamp(1rem, 6svh, 4rem) clamp(1.5rem, 5vw, 5rem);
  }

  .stop.is-end { justify-content: flex-end; }

  /* intro card sits higher, clear of the name on the cube face */
  @media (min-width: 56.3em), (orientation: landscape) and (min-height: 30.01em) {
    #s0 { align-items: flex-start; padding-block-start: clamp(4rem, 9svh, 7rem); }
  }

  .hud {
    position: fixed;
    inset-block-start: var(--ui-inset);
    inset-inline-end: calc(50% - min(50%, 660px) + var(--ui-inset));
    z-index: 2;
    display: grid;
    justify-items: end;
    gap: .5rem;
    color: #3a3f55;   /* muted dark grey counter */
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    pointer-events: none;
  }

  .lang-btn {
    position: fixed;
    inset-block-start: var(--ui-inset);
    inset-inline-start: calc(50% - min(50%, 660px) + var(--ui-inset));
    z-index: 3;
    padding: .25rem .625rem;
    border: var(--line) solid var(--border-strong);
    background: var(--card-bg);
    color: #10131a;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    cursor: pointer;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    transition: color .2s, border-color .2s;
  }

  .lang-btn:hover { border-color: var(--fg); color: var(--fg); }

  @media (max-height: 30em) { .hud { display: none; } }

  .progress {
    display: block;
    inline-size: 7.5rem;
    block-size: 1px;
    overflow: hidden;
    background: oklch(70% .01 300 / .3);
  }

  .progress-fill {
    display: block;
    block-size: 100%;
    background: #3a3f55;
    transform: scaleX(0);
    transform-origin: left;
  }

  @media (max-width: 56.25em) and (orientation: portrait) {
    :root {
      --ui-inset: 1rem;
      --scene-min: 4.5rem;
      --card-reserve: 17rem;
      --cube-size: min(calc(100vw - 2 * var(--ui-inset)), 26rem, var(--cube-max, 26rem), calc((100svh - var(--scene-min) - var(--card-reserve)) / 1.2));
      --scene-top: max(var(--scene-min), calc((100svh - var(--card-reserve) - var(--cube-size) * 1.2) / 2));
      --cube-y: calc(var(--scene-top) + var(--cube-size) / 2);
    }

    .scene {
      place-items: start center;
      padding-block-start: var(--scene-top);
      perspective-origin: 50% calc(var(--scene-top) + var(--cube-size) / 2);
    }

    .stop, .stop.is-end {
      align-items: flex-end;
      justify-content: stretch;
      padding: 0 1rem 1rem;
    }
  }

  @media (max-width: 56.25em) and (orientation: portrait) and (max-height: 42em) {
    :root { --scene-min: 4rem; }
  }

  @media (orientation: landscape) and (max-height: 30em) {
    :root {
      --cube-size: min(64svh, 40vw, var(--cube-max, 1024px));
      --scene-inset: clamp(1.5rem, 5vw, 5rem);
      --cube-x: calc(var(--scene-inset) + var(--cube-size) / 2);
    }

    .scene {
      place-items: center start;
      padding-inline-start: var(--scene-inset);
      perspective-origin: calc(var(--scene-inset) + var(--cube-size) / 2) 50%;
    }

    .stop, .stop.is-end { justify-content: flex-end; padding-block: 1rem; }
  }
}

@layer cube {
  .cube-shadow {
    --shadow-height: .14;
    --shadow-gap: .04;
    inline-size: var(--cube-size);
    block-size: var(--cube-size);
    background: radial-gradient(closest-side, color-mix(in oklch, var(--shadow-color) 30%, transparent), transparent) center / 100% calc(var(--shadow-height) * 100%) no-repeat;
    translate: calc(var(--cube-size) * var(--shadow-shift, 0)) calc(var(--cube-size) * (.5 + var(--shadow-gap) + var(--shadow-height) / 2));
    scale: var(--shadow-spread, 1) 1;
    opacity: var(--shadow-alpha, 1);
    pointer-events: none;
    transition: filter var(--scene-fade) ease var(--spinner-exit);
  }

  .cube {
    --s: var(--cube-size);
    position: relative;
    inline-size: var(--s);
    block-size: var(--s);
    transform-style: preserve-3d;
    transform: translateZ(calc(var(--s) / -2)) rotateX(-90deg) rotateY(0deg);
    will-change: transform;
    transition: translate var(--scene-fade) var(--reveal-ease) var(--spinner-exit);
  }

  .face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    backface-visibility: hidden;
    background: var(--card-paint);   /* see-through, frosted like the strips */
    box-shadow: inset 0 0 0 var(--line) oklch(100% 0 0 / .18);
    outline: 1px solid transparent;   /* smoother anti-aliased edges in 3D */
    transition: opacity var(--scene-fade) ease var(--spinner-exit);
  }

  /* halo around the box */
  .cube-glow {
    inline-size: calc(var(--cube-size) * 1.7);
    block-size: calc(var(--cube-size) * 1.7);
    border-radius: 50%;
    background:
      radial-gradient(closest-side at 45% 45%, oklch(100% 0 0 / .7), transparent 90%),
      radial-gradient(closest-side at 60% 60%, oklch(70% .17 35 / .18), transparent 90%);
    filter: blur(calc(var(--cube-size) * .07));
    pointer-events: none;
    animation: halo-breathe 6s ease-in-out infinite alternate;
    transition: opacity var(--scene-fade) ease var(--spinner-exit);
  }

  [data-state="loading"] .cube-glow { opacity: 0; }

  @keyframes halo-breathe {
    from { scale: .94; opacity: .7; }
    to   { scale: 1.06; opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cube-glow { animation: none; }
  }


  [data-state="loading"] .face { opacity: 0; }
  [data-state="loading"] .cube { translate: 0 1.5rem; }
  [data-state="loading"] .cube-shadow { filter: opacity(0); }

  .face[data-face="front"]  { transform: translateZ(calc(var(--s) / 2)); }
  .face[data-face="back"]   { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
  .face[data-face="right"]  { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
  .face[data-face="left"]   { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
  .face[data-face="top"]    { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
  .face[data-face="bottom"] { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }

  .face::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      radial-gradient(circle farthest-corner at var(--sheen-x, 50%) var(--sheen-y, 50%), color-mix(in oklab, var(--sheen-color) calc(var(--sheen, 0) * 100%), transparent), transparent 70%)
      color-mix(in oklab, var(--shade-color) calc(var(--shade, 0) * 100%), transparent);
    pointer-events: none;
  }

  .face img {
    position: absolute;
    inset: 0;
    display: block;
    inline-size: 100%;
    block-size: 100%;
    object-fit: cover;
    animation: face-in var(--face-fade) ease-out backwards;
    filter: url(#duotone);
  }

  /* ── deck of flying sheets (replaces the cube) ── */
  .deck {
    --s: var(--sheet-h);
    --mat: calc(var(--s) * .07);         /* frame around the square thumbnail */
    position: relative;
    inline-size: var(--sheet-w);
    block-size: var(--s);
    transform-style: preserve-3d;
    transition: translate var(--scene-fade) var(--reveal-ease) var(--spinner-exit);
  }

  [data-state="loading"] .deck { translate: 0 1.5rem; }

  /* thumbnail stays square, centred on the wider sheet → coloured mat around it */
  .sheet img {
    inset: var(--mat) auto auto 50%;
    inline-size: auto;
    block-size: calc(100% - 2 * var(--mat));
    aspect-ratio: 1;
    translate: -50% 0;
    outline: 1px solid #000;
  }

  .sheet {
    -webkit-backdrop-filter: blur(5px) saturate(1.15);
    backdrop-filter: blur(5px) saturate(1.15);
    will-change: transform;
    box-shadow: 0 18px 40px -12px oklch(0% 0 0 / .35);
  }

  /* only the sheet on top shows its content — the ones underneath are plain frosted glass,
     so their images never ghost through the see-through top sheet */
  .sheet > img,
  .sheet > .face-open,
  .sheet > .face-placeholder,
  .sheet > .face-intro { opacity: var(--content-o, 1); }

  .face-placeholder {
    display: grid;
    block-size: 100%;
    place-items: center;
    padding: calc(var(--s) * .08);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    text-align: center;
  }

  .face-spinner {
    --spinner-size: clamp(1.5rem, calc(var(--s) * .07), 2.25rem);
    --spinner-line: calc(var(--spinner-size) * .09);
    --spinner-track: color-mix(in oklch, var(--border) 45%, transparent);
    inline-size: var(--spinner-size);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      conic-gradient(transparent var(--arc-start), var(--border-strong) 0 var(--arc-end), transparent 0),
      linear-gradient(var(--spinner-track), var(--spinner-track));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--spinner-line) - .5px), #000 calc(100% - var(--spinner-line)));
    mask: radial-gradient(farthest-side, transparent calc(100% - var(--spinner-line) - .5px), #000 calc(100% - var(--spinner-line)));
    animation:
      face-in .2s ease-out .15s backwards,
      face-spin 1.4s linear infinite,
      face-arc 1.6s cubic-bezier(.65, 0, .35, 1) infinite;
    transition: scale var(--spinner-exit) ease-in, opacity var(--spinner-exit) ease-in;
  }

  .face-placeholder.is-done .face-spinner { scale: .5; opacity: 0; }
  .face-placeholder.is-done ~ img { animation-delay: var(--spinner-exit); }

  @media (prefers-reduced-motion: reduce) {
    .face-spinner { animation-duration: .2s, 3s, 3.2s; }
  }

  @keyframes face-in { from { opacity: 0; } }
  @keyframes face-spin { to { rotate: 1turn; } }
  @keyframes face-arc {
    0%   { --arc-start: 0%; --arc-end: 0%; }
    15%  { --arc-start: 0%; }
    65%  { --arc-end: 100%; }
    100% { --arc-start: 100%; --arc-end: 100%; }
  }

  /* intro / contact faces match the cards: same colour + spectrum line on top */
  .face:has(.face-intro) { background: var(--card-paint); }

  .face-intro::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    block-size: max(2px, calc(var(--s) * .005));
    background: var(--fg);
  }

  .face-intro {
    position: relative;
    display: grid;
    align-content: end;
    gap: calc(var(--s) * .025);
    block-size: 100%;
    padding: calc(var(--s) * .08) calc(var(--s) * .08) calc(var(--s) * .12);
  }

  .face-intro-label,
  .face-intro-count {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
  }

  .face-intro-title {
    display: -webkit-box;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    line-clamp: 4;
    font-size: calc(var(--s) * .09);
    font-weight: 700;
    letter-spacing: -.035em;
    line-height: 1.05;
    padding-block-end: .12em;   /* keep descenders (g, y) from being clipped */
    overflow-wrap: anywhere;
  }

  .face-intro-title { color: var(--fg); }
  .face-intro-title em { color: var(--accent); font-style: normal; }
}

@layer components {
  .card {
    position: relative;
    --card-pad-block: clamp(2rem, 4svh, 3rem);
    --card-pad-inline: clamp(1.75rem, 2.6vw, 2.75rem);
    inline-size: 100%;
    max-inline-size: clamp(24rem, calc(var(--frame-w) * .4), 42rem);
    padding: var(--card-pad-block) var(--card-pad-inline);
    border-inline-start: var(--line) solid var(--border-strong);
    background: var(--card-paint);
    box-shadow: var(--card-shadow);
    -webkit-backdrop-filter: blur(5px) saturate(1.15);
    backdrop-filter: blur(5px) saturate(1.15);
  }

  .pen .card::before {
    content: attr(data-index);
    content: attr(data-index) / "";
    position: absolute;
    z-index: -1;
    inset-block-end: calc(100% - .3em);
    inset-inline-start: calc(var(--card-pad-inline) - .03em);
    color: var(--numeral-color);
    font-family: var(--font-numeral);
    font-size: var(--numeral-size);
    font-weight: 700;
    letter-spacing: -.05em;
    line-height: .8;
    pointer-events: none;
    user-select: none;
  }

  .pen.is-end .card::before { inset-inline: auto var(--card-pad-inline); }

  .stop.is-end .card {
    border-inline-start: 0;
    border-inline-end: var(--line) solid var(--border-strong);
    text-align: end;
  }

  .card-label,
  .card-meta {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
  }

  .card h1 {
    margin-block-start: .5rem;
    font-size: clamp(2rem, 3.8vw, 3.25rem);
    font-weight: 700;
    letter-spacing: -.035em;
    line-height: 1.08;
    overflow-wrap: anywhere;
  }

  /* red windows: black text, light grey surname, black top edge */
  .card,
  .face-intro {
    --fg: #000;
    --muted: #2b0b03;
    --soft: var(--bg);   /* button text = page background */
    --border: oklch(0% 0 0 / .25);
    --border-strong: oklch(0% 0 0 / .5);
    --accent: var(--c-indigo);   /* surname: light grey */
    color: var(--fg);
  }

  .card h1 { color: var(--fg); }
  .card h1 em { color: var(--accent); font-style: normal; }

  .card h2 {
    margin-block-start: .5rem;

  .cta-back:hover { border-color: var(--fg); color: var(--fg); }

  /* thin spectrum line along the top edge of every card */
  .card::after {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    block-size: 2px;
    background: var(--fg);
    pointer-events: none;
  }

  .stop.is-end .card::after { background: var(--fg); }

  .card-links a:hover { color: var(--accent); }
  .tag { border-color: var(--border-strong); }

  .icon {
    flex: none;
    inline-size: var(--icon-size, 1em);
    block-size: var(--icon-size, 1em);
    translate: 0 calc((var(--icon-size, 1em) - 1cap) / 2);

  .stop .card {
    --enter-x: -1.5rem;

  .stop.is-end .card { --enter-x: 1.5rem; }

  .stop .card > * {
    opacity: 0;
    translate: var(--enter-x) var(--enter-y);
    transition: opacity var(--reveal-duration) ease, translate var(--reveal-duration) var(--reveal-ease);
    transition-delay: calc(var(--reveal-delay) + var(--i, 0) * var(--reveal-stagger));

  .stop .card.is-visible,
  .stop .card.is-visible > * { opacity: 1; translate: 0 0; }

  @media (max-width: 56.25em) and (orientation: portrait), (orientation: landscape) and (max-height: 30em) {
    .card { --card-pad-block: 1.25rem; --card-pad-inline: 1.25rem; }

      border-inline-start: var(--line) solid var(--border-strong);

      text-align: start;

    .pen.is-end .card::before { inset-inline: calc(var(--card-pad-inline) - .03em) auto; }

  @media (max-width: 56.25em) and (orientation: portrait) {

    .card-meta, .card-links { margin-block-start: .625rem; }
    .cta-row { gap: .5rem; margin-block-start: .875rem; }
  }

  @media (orientation: landscape) and (max-height: 30em) {
    .card { max-inline-size: min(40rem, calc(100vw - var(--cube-size) - 3 * var(--scene-inset))); }
    .stop .card, .stop.is-end .card { --enter-x: 1.5rem; }
    .pen .card::before { content: none; }
    .card-description { font-size: var(--text-sm); line-height: 1.6; }
    .card-meta, .card-links { margin-block-start: .75rem; }
    .cta-row { margin-block-start: 1rem; }
  }

  @media (max-width: 56.25em) and (orientation: portrait) and (max-height: 42em), (orientation: landscape) and (max-height: 30em) {
    .card-description { margin-block-start: .5rem; -webkit-line-clamp: 2; line-clamp: 2; }
  }
}

  tpl.content.querySelectorAll('.card').forEach(card => {

  return tpl.content;
}

/* ─── CARD REVEAL ─── */
let observer;
function observeStops() {
  observer?.disconnect();
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => e.target.querySelectorAll('.card').forEach(c => c.classList.toggle('is-visible', e.isIntersecting)));
  }, { threshold: .45 });
  stopsEl.querySelectorAll('.stop').forEach(s => observer.observe(s));
}

  face.dataset.open = j;

  ph.innerHTML = '<span class="face-spinner"></span>';
  face.append(ph);
  const img = new Image();
  img.alt = '';
  img.decoding = 'async';
  img.onload = () => {
    if (!ph.isConnected) return;
    ph.classList.add('is-done');

  };
  img.onerror = () => {
    if (!ph.isConnected) return;
    ph.classList.add('is-done');
    ph.textContent = p.title;

  img.src = p.thumb;
}

/* ─── SHEETS: one card per stop, stacked; the top one flies away on scroll ─── */
const sheets = [];
for (let i = 0; i <= LAST; i++) {
  const el = document.createElement('div');
  el.className = 'face sheet';
  // a little random tilt so the stack looks like loose paper
  el.dataset.rot = (i % 2 ? 1 : -1) * (3 + ((i * 7919) % 13) / 13 * 5);   // 3–8° either way
  cube.append(el);
  sheets.push(el);
}

function fillSheet(i) {
  if (i < 0 || i > LAST) return;
  const el = sheets[i];
  const key = `${i}-${lang}`;
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  delete el.dataset.open;
  el.replaceChildren();
  if (i === 0) buildIntroFace(el);
  else if (i === LAST) buildEndFace(el);
  else buildProjectFace(el, PROJECTS[i - 1], i - 1);
}

/* ─── SCROLL → ORIENTATION ─── */
let tops = [];
let shiftAmount = 0;
const compactMQ = matchMedia('(max-width: 56.25em) and (orientation: portrait), (orientation: landscape) and (max-height: 30em)');

function measure() {
  tops = [...stopsEl.querySelectorAll('.stop')].map(s => s.getBoundingClientRect().top + scrollY);
  // push the deck away from the card, but never past the screen edge
  shiftAmount = 0;   // sheets stay centred between the title and description strips
}

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, e) => a + (b - a) * e;
const ease = x => x * x * (3 - 2 * x);

function update() {
  if (!tops.length) return;
  const y = scrollY;
  let k = 0;
  while (k < tops.length - 1 && y >= tops[k + 1]) k++;
  const f = k < tops.length - 1 ? clamp((y - tops[k]) / (tops[k + 1] - tops[k])) : 0;
  const e = ease(clamp((f - .12) / .76));          // hold at each stop, roll in between
  const shift = lerp(sideOf(k), sideOf(Math.min(k + 1, LAST)), e) * shiftAmount;
  scene.style.translate = `${shift.toFixed(1)}px 0`;
  root.style.setProperty('--light-x', `calc(50% + ${shift.toFixed(1)}px)`);

  const pos = k + e;                       // continuous position in the deck
  const W = scene.clientWidth || innerWidth, H = innerHeight;
  for (let i = 0; i <= LAST; i++) {
    const el = sheets[i];
    const d = i - pos;                     // <0: flying off, 0: on top, >0: waiting underneath
    if (d <= -1 || d > 4) { el.style.visibility = 'hidden'; continue; }
    fillSheet(i);
    el.style.visibility = '';
    const rot = Number(el.dataset.rot);
    let tf, shade;
    if (d < 0) {
      // lift, tilt and fly up and out to the side
      const q = -d, dir = 1;   // every sheet flies off the same way: up and to the right
      tf = `translate3d(${(dir * q * q * W * .55).toFixed(1)}px, ${(-q * H * 1.05).toFixed(1)}px, ${(q * 160).toFixed(1)}px)
            rotateX(${(q * 38).toFixed(2)}deg) rotateZ(${(dir * q * 28).toFixed(2)}deg)`;
      shade = 0;
    } else {
      // stacked behind: further back, lower, slightly rotated and darker
      tf = `translate3d(${(rot * 1.5 * Math.min(1, d)).toFixed(1)}px, ${(d * 30).toFixed(1)}px, ${(-d * 60).toFixed(1)}px)
            rotateZ(${(rot * Math.min(1, d)).toFixed(2)}deg) scale(${(1 - d * .03).toFixed(3)})`;
      shade = Math.min(.45, d * .14);
    }
    el.style.transform = tf;
    el.style.zIndex = String(100 - Math.round(d * 10));
    el.style.opacity = d > 3 ? String(clamp(4 - d)) : '1';
    el.style.setProperty('--shade', shade.toFixed(3));
    el.style.setProperty('--sheen', '0');
    el.style.setProperty('--content-o', clamp(1 - d * 2.5).toFixed(3));   // fade content in as the sheet reaches the top
  }

  const t = k + f;
  const current = Math.round(t);
  hudCount.textContent = `${pad(current)} / ${pad(LAST)}`;
  progressFill.style.transform = `scaleX(${(t / LAST).toFixed(4)})`;
}

let ticking = false;
function requestUpdate() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; update(); });
}

addEventListener('scroll', requestUpdate, { passive: true });
addEventListener('resize', () => { measure(); requestUpdate(); });

/* ─── PROJECT MODAL (same viewer as portfolio.html) ─── */
const modal = document.getElementById('project_modal');
const modalInner = document.getElementById('project_modal_inner');
let activeProject = null;
let mediaIdx = 0;

function placeholderHTML(file) {
  return `<div class="placeholder-thumb"><span>${file.type === 'video' ? '▶' : '◻'}</span><span>${file.src}</span></div>`;
}

function mediaHTML(file) {
  return file.type === 'video'
    ? `<video src="${file.src}" controls playsinline preload="metadata" data-err></video>`
    : `<img src="${file.src}" alt="${file.label}" data-err>`;
}

function thumbsHTML(p) {
  return p.files.map((f, i) => `
    <div class="thumb-item${i === 0 ? ' active' : ''}" data-media="${i}">
      ${f.type === 'video'
        ? `<video src="${f.src}" preload="metadata" muted></video><span class="type-badge">mp4</span>`
        : `<img src="${f.src}" alt="">`}
    </div>`).join('');
}

function openModal(j, idx = 0) {
  const p = PROJECTS[j];
  const t = i18n[lang];
  activeProject = j;
  const multi = p.files.length > 1;
  modalInner.innerHTML = `
    <button class="modal-x" type="button" data-close>✕</button>
    <div class="viewer">
      <div class="viewer-main" id="viewer_main">${mediaHTML(p.files[0])}</div>
      ${multi ? `
        <div class="viewer-nav prev" data-step="-1">&#8592;</div>
        <div class="viewer-nav next" data-step="1">&#8594;</div>
        <div class="viewer-counter" id="viewer_counter">1 / ${p.files.length}</div>` : ''}
    </div>
    <div class="viewer-caption" id="viewer_caption">${p.files[0].label}</div>
    ${multi ? `<div class="thumb-strip">${thumbsHTML(p)}</div>` : ''}
    <div class="expanded-info">
      <p class="card-label">${pad(j + 1)} / ${pad(N)}</p>
      <h2 class="exp-title">${tr(p, 'title')}</h2>
      <div class="exp-meta">
        <div><span class="exp-meta-label">${t.label_client}</span>${p.client}</div>
        <div><span class="exp-meta-label">${t.label_year}</span>${p.year}</div>
        <div><span class="exp-meta-label">${t.label_software}</span>${p.software}</div>
      </div>
      <p class="exp-desc">${tr(p, 'desc')}</p>
      <button class="cta-back exp-close" type="button" data-close>${ICON_BACK} ${t.close_project}</button>
    </div>`;
  modal.hidden = false;
  modal.scrollTop = 0;
  root.style.overflow = 'hidden';
  watchErrors();
  if (idx) setMedia(idx);
}

function closeModal() {
  if (activeProject === null) return;
  modal.hidden = true;
  modalInner.replaceChildren();   // stops any playing video
  activeProject = null;
  mediaIdx = 0;
  root.style.overflow = '';
}

function setMedia(i) {
  if (activeProject === null) return;
  const files = PROJECTS[activeProject].files;
  mediaIdx = (i + files.length) % files.length;
  document.getElementById('viewer_main').innerHTML = mediaHTML(files[mediaIdx]);
  const counter = document.getElementById('viewer_counter');
  if (counter) counter.textContent = `${mediaIdx + 1} / ${files.length}`;
  document.getElementById('viewer_caption').textContent = files[mediaIdx].label;
  modalInner.querySelectorAll('.thumb-item').forEach((el, k) => el.classList.toggle('active', k === mediaIdx));
  watchErrors();
}

// missing media → placeholder with the expected path
function watchErrors() {
  const files = PROJECTS[activeProject].files;
  modalInner.querySelectorAll('[data-err]').forEach(el => {
    el.removeAttribute('data-err');
    el.addEventListener('error', () => { el.outerHTML = placeholderHTML(files[mediaIdx]); }, { once: true });
  });
}

modal.addEventListener('click', e => {
  if (e.target === modal || e.target.closest('[data-close]')) return closeModal();
  const step = e.target.closest('[data-step]');
  if (step) return setMedia(mediaIdx + Number(step.dataset.step));
  const thumb = e.target.closest('[data-media]');
  if (thumb) setMedia(Number(thumb.dataset.media));
});

// open from a cube face or a card button
document.addEventListener('click', e => {
  const opener = e.target.closest('.face[data-open], .card [data-open]');
  if (opener) openModal(Number(opener.dataset.open));
});

/* ─── KEYBOARD: ←/→ jump between stops (or media when a project is open) ─── */
addEventListener('keydown', e => {
  if (activeProject !== null) {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowRight') setMedia(mediaIdx + 1);
    if (e.key === 'ArrowLeft') setMedia(mediaIdx - 1);
    return;
  }
  const dir = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, ' ': 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1 }[e.key];
  if (!dir || e.target.closest?.('input, textarea, button, a')) return;
  e.preventDefault();
  if (!paging) goTo(currentStop() + dir);
});

/* ─── PAGED SCROLLING: one wheel gesture = one project, fast animated jump ─── */
const PAGE_MS = 650;
let paging = false;
let lastWheel = 0;
let needQuiet = false;   // swallow trackpad inertia after a jump

const easeInOut = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

function currentStop() {
  let best = 0;
  tops.forEach((top, i) => { if (Math.abs(top - scrollY) < Math.abs(tops[best] - scrollY)) best = i; });
  return best;
}

function goTo(k) {
  k = clamp(k, 0, LAST);
  const from = scrollY;
  const to = tops[k];
  if (Math.abs(to - from) < 2) return;
  paging = true;
  const t0 = performance.now();
  const step = now => {
    const p = clamp((now - t0) / PAGE_MS);
    scrollTo({ top: from + (to - from) * easeInOut(p), behavior: 'instant' });
    if (p < 1) requestAnimationFrame(step);
    else { paging = false; needQuiet = true; }
  };
  requestAnimationFrame(step);
}

addEventListener('wheel', e => {
  if (activeProject !== null || e.ctrlKey) return;   // modal scrolls normally, pinch-zoom untouched
  e.preventDefault();
  const now = performance.now();
  const gap = now - lastWheel;
  lastWheel = now;
  if (paging) return;
  if (needQuiet && gap < 180) return;                 // still the same flick → ignore
  needQuiet = false;
  if (Math.abs(e.deltaY) < 3) return;
  goTo(currentStop() + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });

// in-page links (Enter / Back / Next / Back to top) use the same quick jump
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#s"]');
  if (!a) return;
  const k = Number(a.getAttribute('href').slice(2));
  if (Number.isNaN(k)) return;
  e.preventDefault();
  goTo(k);
});

/* ─── LANG ─── */
document.getElementById('lang_btn').addEventListener('click', () => {
  lang = lang === 'en' ? 'pl' : 'en';
  render();
  if (activeProject !== null) openModal(activeProject, mediaIdx);
});

      if (sr.next <= 0) {
        sr.next = (sr.period / Math.max(P.ambientRate, .05)) * (.7 + Math.random() * .6);
        const x = Math.min(Math.max(sr.px + sr.ax * Math.sin(t * sr.sx * 6.28 + sr.phx), .06), .94);
        const y = Math.min(Math.max(sr.py + sr.ay * Math.cos(t * sr.sy * 6.28 + sr.phy), .06), .94);
        queueDrop(x, y, P.ambientStrength * (idle ? 1 : P.drivenMult), .03 + Math.random() * .02);
      }
    }
  }

  // invisible "ghost" cursor that stirs the water while nobody interacts
  let genv = 0, gpx = .5, gpy = .5, ginit = false;
  const TAU = 6.283185307;
  function ghostPos(t) {
    const sp = P.ghostSpeed;
    const x = .5 + .30 * Math.sin(t * .037 * TAU * sp) + .12 * Math.sin(t * .011 * TAU * sp + 1.7);
    const y = .5 + .28 * Math.cos(t * .043 * TAU * sp) + .13 * Math.cos(t * .017 * TAU * sp + 4.1);
    return [Math.min(Math.max(x, .06), .94), Math.min(Math.max(y, .06), .94)];
  }
  function collectGhost(t, step) {
    const engaged = t - lastI > P.ghostReturn;
    const rate = step / Math.max(P.ghostFade, .05);
    genv += Math.max(-rate, Math.min(rate, (engaged ? 1 : 0) - genv));
    const [gx, gy] = ghostPos(t);
    if (!ginit) { gpx = gx; gpy = gy; ginit = true; }
    if (genv > .001) {
      const mag = Math.min(P.brushBase + Math.hypot(gx - gpx, gy - gpy) * P.brushGain, P.brushMax) * genv * P.ghostGain;
      if (mag > 1e-4) queueDrop(gx, gy, mag, P.brushRadius);
    }
    gpx = gx; gpy = gy;
  }

  function simStep(step) {
    collectAmbient(now(), step);
    collectGhost(now(), step);
    const cnt = uploadDrops();
    const src = targets[read], dst = targets[read ^ 1];
    gl.useProgram(updateP); gl.bindVertexArray(vao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo); gl.viewport(0, 0, SIM, SIM);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform1i(uL.uState, 0); gl.uniform2f(uL.uTexel, 1 / SIM, 1 / SIM); gl.uniform1f(uL.uAspect, vw / vh);
    gl.uniform1i(uL.uDropCount, cnt); gl.uniform4fv(uL.uDrops, dropData);
    setUniforms(uL, UPD);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    read ^= 1;
  }
  function draw() {
    gl.useProgram(renderP); gl.bindVertexArray(vao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, targets[read].tex);
    gl.uniform1i(rL.uState, 0); gl.uniform2f(rL.uTexel, 1 / SIM, 1 / SIM);
    gl.uniform2f(rL.uResolution, canvas.width, canvas.height); gl.uniform1f(rL.uTime, now()); gl.uniform1f(rL.uAspect, vw / vh);
    setUniforms(rL, REN);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = performance.now(), accum = 0;
  function frame(t) {
    let dt = (t - last) / 1000; if (dt > .25) dt = .25; last = t;
    const step = 1 / P.simRate;
    if (!still) {
      accum += dt; let n = 0;
      while (accum >= step && n < P.maxSub) { simStep(step); accum -= step; n++; }
      if (n === 0) { simStep(step); accum = 0; }
    }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ─── INIT ─── */
scene.hidden = false;
hud.hidden = false;
render();
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.body.dataset.state = 'ready';
  measure();
  update();
}));
</script>
