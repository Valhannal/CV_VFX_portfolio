<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanna Kachurouskaya — FX / Technical Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  /* Remix of 05 (typographic index) + 03 (look / build slider).
     Left: the project list as a venetian blind. Right: thumbnails, or the open project. */
  :root {
    --sky: #ececec;
    --sky-dark: #bdbdbd;
    --mist: #f6f6f6;
    --ink: #000;
    --red: #d42420;
    --blue: #2f55ff;

    --sans: "Space Grotesk", system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;

    --head-h: 3.5rem;
    --list-w: minmax(0, 44fr);
    --panel-w: minmax(0, 56fr);
    --ease: cubic-bezier(.2, .7, .2, 1);
    --hair: 1px;
    --slat-gap: var(--hair);
    --slat-h: calc((100svh - var(--head-h)) / 18 - var(--slat-gap));
    --slat: var(--sky);   /* same grey as the page; only the black gaps draw the blind */
  }

  * , *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--sans); color: var(--ink); background: var(--sky); overflow: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: .75rem; letter-spacing: .01em; }

  /* ── header ── */
  header {
    height: var(--head-h); display: grid; grid-template-columns: var(--list-w) var(--panel-w);
    align-items: center; border-bottom: var(--hair) solid var(--ink);
  }
  header .who { padding-inline: 1.5rem; font-weight: 700; font-size: clamp(1rem, calc(var(--slat-h) * .46), 2rem); letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
  header .who span { font-size: .75rem; letter-spacing: .01em; vertical-align: middle; }
  header .who span { font-weight: 400; margin-left: .75rem; }
  header nav { display: flex; justify-content: flex-end; gap: 1.5rem; padding-inline: 1.5rem; }
  header nav a { text-decoration: none; }
  header nav a:hover { text-decoration: underline; }
  header .who span, header nav a { font-family: var(--mono); font-size: .68rem; font-weight: 400; letter-spacing: .01em; opacity: .4; transition: opacity .15s; }
  header nav a:hover, header nav a[aria-current="page"] { opacity: .85; text-decoration: none; }

  main { height: calc(100% - var(--head-h)); display: grid; grid-template-columns: var(--list-w) var(--panel-w); }

  /* ── the blind ──
     Flat slats with a thin gap between them; the ladder strings show only in the gaps.
     Below the blind the column is the same grey as the rest of the page. */
  .blind { position: relative; height: 100%; overflow: hidden; background: var(--sky); border-right: var(--hair) solid var(--ink); }

  .slats {
    position: relative; list-style: none; margin: 0; padding: 0 0 var(--slat-gap);
    display: grid; grid-auto-rows: var(--slat-h); gap: var(--slat-gap); perspective: 900px;
    background: var(--ink);   /* the gaps between slats */
  }

  .slat {
    position: relative; z-index: 1; display: grid; grid-template-columns: 2.5rem 1fr auto; align-items: center; gap: .75rem;
    width: 100%; height: 100%; padding: 0 1.25rem 0 1.5rem; border: 0; cursor: pointer; text-align: left;
    background: var(--slat);
    transform: rotateX(0deg); transition: transform .3s var(--ease), background .15s, color .15s;
  }
  .slat .n { font: 700 .8rem var(--sans); }
  .slat .t {
    font-family: var(--sans); font-weight: 700; letter-spacing: -.035em; line-height: 1;
    font-size: clamp(1rem, calc(var(--slat-h) * .56), 2.4rem);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slat .meta { text-align: right; font-size: .68rem; line-height: 1.25; white-space: nowrap; opacity: .4; transition: opacity .15s; }
  .slat:hover .meta, .slat.lit .meta, .slat[aria-current="true"] .meta { opacity: .85; }

  /* highlighted slat: black box, white type, a small turn like a slat tilting */
  .slat:hover, .slat.lit, .slat[aria-current="true"] { background: var(--ink); color: #fff; transform: rotateX(-14deg); }
  .slat[aria-current="true"] .n { color: #fff; }
  .blind.has-open .slat:not([aria-current="true"]):not(:hover):not(.lit) { transform: rotateX(20deg); }

  /* ── right panel ── */
  .panel { position: relative; height: 100%; overflow: hidden; }
  .view { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .view[hidden] { display: none; }

  /* thumbnails */
  .thumbs-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 2rem; padding: 0 1.5rem 1.5rem; opacity: .5; }
  .thumbs-foot p { margin: 0; max-width: 60ch; font-size: .8rem; line-height: 1.45; }
  .thumbs { columns: 3 220px; column-gap: .75rem; padding: 1.5rem 1.5rem .75rem; }
  .thumb {
    display: block; width: 100%; margin: 0 0 .75rem; padding: 0; border: 0; background: #000; cursor: pointer;
    break-inside: avoid; position: relative; overflow: hidden;
  }
  .thumb img { width: 100%; display: block; transition: transform .5s var(--ease), filter .35s; }
  .thumb .cap {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: .5rem;
    padding: .45rem .6rem; background: var(--ink); color: #fff; text-align: left;
    translate: 0 100%; transition: translate .25s var(--ease);
  }
  .thumb:hover img, .thumb.lit img { transform: scale(1.03); }
  .thumb:hover .cap, .thumb.lit .cap { translate: 0 0; }
  .thumbs.dim .thumb:not(.lit):not(:hover) img { filter: grayscale(1) contrast(1.05); }

  /* project view */
  .proj-bar {
    position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 1rem;
    padding: .7rem 1.5rem; background: var(--ink); color: #fff;
  }
  .proj-bar .n { font: 700 1rem var(--sans); color: #fff; opacity: .6; }
  .proj-bar h1 { margin: 0; font: 700 clamp(1.1rem, 1.7vw, 1.5rem)/1.1 var(--sans); letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-bar .step { display: flex; gap: .25rem; }
  .icon-btn {
    min-width: 2.25rem; height: 2.25rem; display: inline-grid; place-items: center; padding: 0 .6rem;
    border: 1px solid rgb(255 255 255 / .35); background: transparent; color: #fff; cursor: pointer;
  }
  .icon-btn:hover { background: #fff; color: #000; }

  .proj-body { padding: 1.25rem 1.5rem 3rem; }

  /* look / build slider (from 03) */
  .compare { position: relative; background: #000; overflow: hidden; cursor: ew-resize; touch-action: pan-y; user-select: none; }
  .compare .layer { position: absolute; inset: 0; }
  .compare .layer > * { width: 100%; height: 100%; object-fit: contain; display: block; }
  .compare .build { clip-path: inset(0 0 0 var(--x, 50%)); background: #000; }
  .compare .build::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgb(255 255 255 / .1) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .1) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .compare .handle { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 2px; translate: -1px; background: #fff; pointer-events: none; }
  .compare .handle::after {
    content: "⟷"; position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: 40px; height: 40px;
    display: grid; place-items: center; border-radius: 50%; background: #fff; color: #000;
  }
  .compare .side { position: absolute; top: .75rem; padding: .3rem .55rem; color: #fff; pointer-events: none; font-weight: 700; }
  .compare .side.look { left: .75rem; background: #fff; color: #000; }
  .compare .side.tech { right: .75rem; background: #000; color: #fff; box-shadow: inset 0 0 0 1px #fff; }

  .facts { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.5rem; margin: 1.25rem 0 2rem; }
  .facts p { margin: 0; font-size: 1.02rem; line-height: 1.55; max-width: 56ch; }
  .facts dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .35rem .9rem; align-content: start; }
  .facts dt { color: #3a3f48; }
  .facts dd { margin: 0; }
  .how { margin: .9rem 0 0; padding: 0; list-style: none; display: grid; gap: .3rem; }
  .how li::before { content: "+ "; font-weight: 700; }

  .materials-h { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--ink); padding: .6rem 0 .9rem; }
  .materials-h b { font-weight: 900; font-size: 1.1rem; letter-spacing: -.02em; }
  .materials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  .materials figure { margin: 0; }
  .materials figure.wide { grid-column: 1 / -1; }
  .materials .frame { background: #000; }
  .materials video, .materials img { width: 100%; display: block; max-height: 78vh; object-fit: contain; margin-inline: auto; }
  .materials figcaption { padding-top: .4rem; }

  .next { margin-top: 2.5rem; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; border: 0; cursor: pointer; background: var(--ink); color: #fff; text-align: left; }
  .next b { font: 700 1.5rem/1 var(--sans); letter-spacing: -.03em; }
  .next:hover { background: #333; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    header, main { grid-template-columns: 1fr; }
    header nav { display: none; }
    main { height: auto; }
    .blind { height: auto; border-right: 0; }
    .slats { grid-auto-rows: 4.25rem; }
    .slat .meta { display: none; }
    .panel { height: auto; }
    .view { position: static; overflow: visible; }
    .view.project { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--sky); }
    .facts, .materials { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .slat, .thumb img, .thumb .cap { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="who">Hanna Kachurouskaya <span class="mono">FX / Technical Artist</span></div>

<script>
/* ─── DATA ─── same projects and files as the live site, plus a look/build pair for the slider */
const A = '../assets/';

    files: [
      ['image', 'proj-03/render_01.png', 'Hero render, violet'],
      ['image', 'proj-03/ai_concept_01.png', 'Concept, AI generated'],

      ['video', 'proj-03/video_02.mp4', 'Final render stage, gold'],

  { id: 'proj-05', title: 'Huawei Maestro', kind: 'AI video + VFX', client: 'Huawei', year: 2026,

    look: 'proj-05/hero.mp4', build: 'proj-05/camera_clay_02.mp4', ratio: '3 / 1',
    files: [
      ['video', 'proj-05/sim_preview.mp4', 'Sim preview'],
      ['video', 'proj-05/camera_clay_01.mp4', 'Camera clay preview', 'wide'],
      ['image', 'proj-05/ai_concept_iteration.png', 'AI concept iteration'],
      ['image', 'proj-05/ai_first_frame.png', 'AI first frame'],
      ['video', 'proj-05/ai_video.mp4', 'AI video, Kling', 'wide'],
    ] },
  { id: 'proj-02', title: 'OnePlus ACE 6T', kind: 'Launch VFX series', client: 'OnePlus', year: 2025,
    software: 'Houdini · VEX · Redshift · Fusion', tags: 'Procedural · Lighting',
    short: 'Six launch shots across two colourways: a blinking techno look for purple, a ferrofluid black-diamond look for black. Fully procedural, from concept through lighting to delivery.',
    how: ['Six shots, each with its own look R&D', 'Procedural ferrofluid, no simulation', 'Lighting, rendering and delivery'],
    look: 'proj-02/video_04.mp4', build: 'proj-02/video_05.mp4', ratio: '16 / 9',
    files: [
      ['video', 'proj-02/hero.mp4', 'Tunnel shot', 'wide'],
      ['video', 'proj-02/cameras_preview.mp4', 'Camera previews'],
      ['video', 'proj-02/video_02.mp4', 'Purple version shot'],
      ['video', 'proj-02/video_00.mp4', 'R&D, stereo effect'],
      ['video', 'proj-02/video_01.mp4', 'R&D, stereo effect'],

      ['video', 'proj-02/video_06.mp4', 'R&D, ferrofluid'],

  { id: 'proj-07', title: 'Xiaomi Mix Fold 3', kind: 'Motion wallpaper, solo', client: 'Xiaomi', year: 2023,
    software: 'Houdini · Solaris · Karma', tags: 'Pyro · RBD · Karma',
    short: 'My first solo wallpaper: a flower born from an explosion. Several pyro sims layered with particles and RBD, rendered in Karma because it holds volumes better than Redshift.',
    how: ['Several layered explosion sims', 'Particles and RBD', 'Karma for volume quality'],
    look: 'proj-07/hero.mp4', build: 'proj-07/render_01.png', ratio: '1700 / 1920', buildLabel: 'colourway',
    files: [] },
  { id: 'proj-04', title: 'Xiaomi Amoled', kind: 'Motion wallpaper R&D', client: 'Xiaomi', year: 2024,

  { id: 'proj-06', title: 'Water / Sand / Ice', kind: 'Internal R&D', client: 'Millarc CGI', year: 2024,

const pad = n => String(n).padStart(2, '0');
const isVid = p => p.endsWith('.mp4');
const mediaEl = (p, extra = '') => isVid(p)
  ? `<video src="${A + p}" muted loop playsinline autoplay preload="metadata" ${extra}></video>`
  : `<img src="${A + p}" alt="" loading="lazy" ${extra}>`;

/* ─── BUILD LIST + THUMBS ─── */
const slats = document.getElementById('slats');
const thumbs = document.getElementById('thumbs');
const blind = document.getElementById('blind');
document.getElementById('count').textContent = `${pad(PROJECTS.length)} projects`;

PROJECTS.forEach((p, i) => {
  slats.insertAdjacentHTML('beforeend', `
    <li><button class="slat" type="button" data-i="${i}">
      <span class="n">${pad(i + 1)}</span>
      <span class="t">${p.title}</span>
      <span class="meta mono">${p.tags}<br>${p.client} · ${p.year}</span>
    </button></li>`);
  thumbs.insertAdjacentHTML('beforeend', `
    <button class="thumb" type="button" data-i="${i}" aria-label="Open ${p.title}">
      <img src="${A}${p.id}/thumb.${p.id === 'proj-01' ? 'jpg' : 'png'}" alt="">
      <span class="cap mono"><b>${pad(i + 1)} ${p.title}</b><span>${p.year}</span></span>
    </button>`);
});

/* hovering either side lights up its partner on the other side */
function light(i) {
  slats.querySelectorAll('.slat').forEach(s => s.classList.toggle('lit', +s.dataset.i === i));
  thumbs.querySelectorAll('.thumb').forEach(t => t.classList.toggle('lit', +t.dataset.i === i));
  thumbs.classList.toggle('dim', i != null);
}
for (const box of [slats, thumbs]) {
  box.addEventListener('pointerover', e => { const el = e.target.closest('[data-i]'); if (el) light(+el.dataset.i); });
  box.addEventListener('pointerleave', () => light(null));
  box.addEventListener('focusin', e => { const el = e.target.closest('[data-i]'); if (el) light(+el.dataset.i); });
  box.addEventListener('click', e => { const el = e.target.closest('[data-i]'); if (el) open(+el.dataset.i); });
}

/* ─── PROJECT VIEW ─── */
const thumbsView = document.getElementById('thumbs_view');
const projView = document.getElementById('project_view');
let current = null;

function open(i, fromHash) {
  const p = PROJECTS[i];
  current = i;
  const files = p.files.map(([type, src, label, size]) => `
    <figure class="${size || ''}">
      <div class="frame">${mediaEl(src)}</div>
      <figcaption class="mono">${label}</figcaption>
    </figure>`).join('');
  const nextP = PROJECTS[(i + 1) % PROJECTS.length];

  projView.innerHTML = `
    <div class="proj-bar">
      <span class="n">${pad(i + 1)}</span>
      <h1>${p.title}</h1>
      <div class="step">
        <button class="icon-btn mono" type="button" data-step="-1" aria-label="Previous project">↑</button>
        <button class="icon-btn mono" type="button" data-step="1" aria-label="Next project">↓</button>
      </div>
      <button class="icon-btn mono" type="button" data-close aria-label="Close project">✕</button>
    </div>
    <div class="proj-body">
      <div class="compare" id="compare" style="aspect-ratio:${p.ratio}; max-height:72vh; margin-inline:auto;" tabindex="0"
           role="slider" aria-label="Compare final and process" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <div class="layer look">${mediaEl(p.look)}</div>
        <div class="layer build">${mediaEl(p.build)}</div>
        <div class="handle"></div>
        <span class="side look mono">final</span>
        <span class="side tech mono">${p.buildLabel || 'process'}</span>
      </div>

      <div class="facts">
        <div>
          <p>${p.short}</p>
          <ul class="how mono">${p.how.map(h => `<li>${h}</li>`).join('')}</ul>
        </div>
        <dl class="mono">
          <dt>Client</dt><dd>${p.client}</dd>
          <dt>Year</dt><dd>${p.year}</dd>
          <dt>Type</dt><dd>${p.kind}</dd>
          <dt>Tools</dt><dd>${p.software}</dd>
        </dl>
      </div>

      ${files ? `<div class="materials-h"><b>More from this project</b><span class="mono">${p.files.length} items</span></div>
      <div class="materials">${files}</div>` : ''}

      <button class="next" type="button" data-step="1">
        <span class="mono">Next project</span><b>${nextP.title}</b>
      </button>
    </div>`;

  thumbsView.hidden = true;
  projView.hidden = false;
  projView.scrollTop = 0;
  blind.classList.add('has-open');
  slats.querySelectorAll('.slat').forEach(s => s.setAttribute('aria-current', +s.dataset.i === i));
  if (!fromHash) history.replaceState(null, '', '#' + p.id);
  wireCompare();
  syncPair();
}

function close() {
  current = null;
  projView.hidden = true; projView.innerHTML = '';
  thumbsView.hidden = false;
  blind.classList.remove('has-open');
  slats.querySelectorAll('.slat').forEach(s => s.removeAttribute('aria-current'));
  history.replaceState(null, '', location.pathname);
}

projView.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return close();
  const step = e.target.closest('[data-step]');
  if (step) open((current + +step.dataset.step + PROJECTS.length) % PROJECTS.length);
});
document.querySelector('[data-home]').addEventListener('click', e => { e.preventDefault(); close(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && current != null) close(); });

/* slider: follows the pointer, arrow keys nudge it */
function wireCompare() {
  const c = document.getElementById('compare');
  const set = pct => {
    pct = Math.max(0, Math.min(100, pct));
    c.style.setProperty('--x', pct + '%');
    c.setAttribute('aria-valuenow', Math.round(pct));
  };
  c.addEventListener('pointermove', e => {
    const r = c.getBoundingClientRect();
    set((e.clientX - r.left) / r.width * 100);
  });
  c.addEventListener('keydown', e => {
    const now = parseFloat(c.style.getPropertyValue('--x')) || 50;
    if (e.key === 'ArrowLeft') set(now - 5);
    if (e.key === 'ArrowRight') set(now + 5);
  });
}
/* keep final and process in step so the wipe lines up */
function syncPair() {
  const vids = [...document.querySelectorAll('#compare video')];
  if (vids.length < 2) return;
  const [a, b] = vids;
  a.addEventListener('timeupdate', () => {
    if (!b.duration) return;
    const want = a.currentTime % b.duration;
    if (Math.abs(b.currentTime - want) > .15) b.currentTime = want;
  });
}

/* pixel snapping: with display scaling (125%, 150%) a 1px rule and fractional slat heights
   land between device pixels, so some gaps render thicker than others. Size the hairline
   and the slats in whole device pixels instead. */
function snapBlind() {
  const dpr = devicePixelRatio || 1;
  const hairDev = Math.max(1, Math.round(dpr));                       // one hairline, in device pixels
  const headDev = Math.round(document.querySelector('header').getBoundingClientRect().height * dpr);
  const availDev = Math.round(innerHeight * dpr) - headDev;
  const slatDev = Math.floor(availDev / 18) - hairDev;                  // nine slats fill about half the column
  root.style.setProperty('--hair', hairDev / dpr + 'px');
  root.style.setProperty('--slat-h', slatDev / dpr + 'px');
}
const root = document.documentElement;
addEventListener('resize', snapBlind);
matchMedia(`(resolution: ${devicePixelRatio}dppx)`).addEventListener?.('change', snapBlind);
snapBlind();

/* deep links: #proj-03 opens that project directly */
const fromHash = PROJECTS.findIndex(p => '#' + p.id === location.hash);
if (fromHash >= 0) open(fromHash, true);
</script>
