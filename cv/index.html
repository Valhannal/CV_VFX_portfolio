<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanna Kachurouskaya — CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  /* Same frame as the portfolio (19/20-blinds): header, blind on the left, panel on the right.
     The blind lists the CV versions; the panel previews the chosen one. */
  :root {
    --sky: #ececec;
    --ink: #000;
    --sans: "Space Grotesk", system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    --head-h: 3.5rem;
    --hair: 1px;
    --slat-h: calc((100svh - var(--head-h)) / 18 - var(--hair));
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--sans); color: var(--ink); background: var(--sky); overflow: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: .75rem; letter-spacing: .01em; }

  header { height: var(--head-h); display: grid; grid-template-columns: minmax(0, 44fr) minmax(0, 56fr); align-items: center; border-bottom: var(--hair) solid var(--ink); }
  header .who { padding-inline: 1.5rem; font-weight: 700; font-size: clamp(1rem, calc(var(--slat-h) * .46), 2rem); letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
  header .who span { font-weight: 400; margin-left: .75rem; font-size: .75rem; letter-spacing: .01em; vertical-align: middle; }
  header nav { display: flex; justify-content: flex-end; gap: 1.5rem; padding-inline: 1.5rem; }
  header nav a { text-decoration: none; }
  header nav a:hover, header nav a[aria-current="page"] { text-decoration: underline; }
  header .who span, header nav a { font-family: var(--mono); font-size: .68rem; font-weight: 400; letter-spacing: .01em; opacity: .4; transition: opacity .15s; }
  header nav a:hover, header nav a[aria-current="page"] { opacity: .85; text-decoration: none; }

  main { height: calc(100% - var(--head-h)); display: grid; grid-template-rows: auto 1fr; }
  /* one quiet action on the same grey as the page, styled like the header links */
  .bar { display: flex; justify-content: flex-end; padding: .9rem 1.5rem 0; }
  .bar button { padding: 0; border: 0; background: none; font-size: .68rem; opacity: .4; cursor: pointer; transition: opacity .15s; }
  .bar button:hover { opacity: .85; }

  /* the A4 page is scaled to fit the window; on narrow screens it fits the width and scrolls */
  .stage { position: relative; overflow: auto; background: var(--sky); }
  .stage .page { position: relative; margin: 1.25rem auto; }
  .stage iframe { position: absolute; top: 0; left: 0; width: 210mm; height: 297mm; border: 0; transform-origin: top left; background: var(--sky); box-shadow: 0 10px 30px -12px rgb(0 0 0 / .35); }
  @media (max-width: 700px) {
    header { grid-template-columns: 1fr auto; }
    header .who span, header nav a[href^="mailto"] { display: none; }
    header nav { gap: 1rem; }
  }
</style>
</head>
<body>
  <header>
    <div class="who">Hanna Kachurouskaya <span class="mono">FX / Technical Artist</span></div>
    <nav class="mono" aria-label="Main">
      <a href="../index.html">Work</a><a href="./" aria-current="page">CV</a><a href="mailto:valynets.h@gmail.com">valynets.h@gmail.com</a>
    </nav>
  </header>

  <main>
    <div class="bar mono">
      <button id="print" type="button">Print / Save PDF</button>
    </div>
    <div class="stage" id="stage"><div class="page" id="page"><iframe id="frame" src="cv-5-black-slat.html" title="CV — Hanna Kachurouskaya"></iframe></div></div>
  </main>

<script>
  /* the chosen layout is cv-5-black-slat.html; all eight versions stay in versions.html */
  const frame = document.getElementById('frame');
  const page = document.getElementById('page');
  function fit() {
    const st = document.getElementById('stage');
    const mm = 96 / 25.4, w = 210 * mm, h = 297 * mm;
    let k = Math.min((st.clientHeight - 40) / h, (st.clientWidth - 40) / w);
    if (st.clientWidth < 700) k = (st.clientWidth - 24) / w;   // phone: fit width, scroll down
    frame.style.transform = `scale(${k})`;
    page.style.width = w * k + 'px';
    page.style.height = h * k + 'px';
  }
  // ask the CV page to print itself: a message works even when the files are opened straight from disk
  document.getElementById('print').onclick = () => frame.contentWindow.postMessage('print-cv', '*');
  // inside the preview the sheet is the whole page: drop its desk margin and shadow
  frame.addEventListener('load', () => {
    const d = frame.contentDocument;
    if (!d) return;   // opened from disk: the CV page handles this itself (html.framed)
    d.documentElement.style.background = 'none';
    d.body.style.padding = '0';
    const sheet = d.querySelector('.sheet');
    if (sheet) sheet.style.boxShadow = 'none';
  });
  addEventListener('resize', fit);
  fit();

</script>
</body>
</html>
